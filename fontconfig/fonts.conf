<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- island-dots: text rendering.
       Qt reads fontconfig directly; GTK reads gsettings. These match
       what GNOME is already set to (rgba / medium / rgb) so the shell
       and the rest of the desktop rasterise the same way. -->

  <match target="pattern">
    <!-- fontconfig was reporting 75, the legacy X11 default. Hinting
         and bitmap decisions are made against this, so a wrong value
         costs sharpness at exactly the small sizes a UI uses. -->
    <edit name="dpi" mode="assign"><double>96</double></edit>
  </match>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <!-- slight: vertical hinting only. Keeps the typeface's own shapes
         instead of snapping stems sideways, which is the macOS-like
         trade and the one that survives at 11-13px. -->
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <!-- Patched fonts ship bitmap strikes that override the outline at
         some sizes and look nothing like the rest. -->
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
