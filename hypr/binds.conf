# ─────────────────────────────────────────────────────────────
# Keybinds
# https://wiki.hypr.land/Configuring/Binds/
#
# Shell actions go through Quickshell's IPC rather than spawning
# separate programs. In QML you expose them with:
#
#   IpcHandler {
#       target: "launcher"
#       function toggle(): void { ... }
#   }
#
# and call them with:  qs -c island ipc call launcher toggle
# List what's available with: qs -c island ipc show
# ─────────────────────────────────────────────────────────────

$mainMod = SUPER
$qs = qs -c island ipc call

# ── Applications ─────────────────────────────────────────────

bind = $mainMod, X, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, R, exec, hyprctl reload

# ── Shell ────────────────────────────────────────────────────
# These fail harmlessly until the matching IpcHandler exists.

bind = $mainMod, R, exec, $qs launcher toggle
bind = ALT, Space, exec, $qs launcher toggle
bind = $mainMod, V, exec, $qs clipboard toggle
bind = $mainMod, N, exec, $qs notifications toggle
bind = $mainMod, S, exec, $qs settings toggle
bind = $mainMod SHIFT, W, exec, $qs wallpaper next
bind = $mainMod SHIFT, C, exec, $qs controlcenter toggle
bind = $mainMod, L, exec, $qs lock activate

# ── Window control ───────────────────────────────────────────

bind = $mainMod, Q, killactive
bind = $mainMod, Space, togglefloating
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, Tab, cyclenext

# ── Focus ────────────────────────────────────────────────────

bind = ALT, left, movefocus, l
bind = ALT, right, movefocus, r
bind = ALT, up, movefocus, u
bind = ALT, down, movefocus, d

# ── Move windows ─────────────────────────────────────────────

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

binde = CTRL SHIFT, left, moveactive, -50 0
binde = CTRL SHIFT, right, moveactive, 50 0
binde = CTRL SHIFT, up, moveactive, 0 -50
binde = CTRL SHIFT, down, moveactive, 0 50

# ── Resize ───────────────────────────────────────────────────

binde = CTRL ALT, left, resizeactive, -50 0
binde = CTRL ALT, right, resizeactive, 50 0
binde = CTRL ALT, up, resizeactive, 0 -50
binde = CTRL ALT, down, resizeactive, 0 50

# ── Workspaces ───────────────────────────────────────────────

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9

bind = $mainMod, left, workspace, e-1
bind = $mainMod, right, workspace, e+1
bind = CTRL, left, movetoworkspace, e-1
bind = CTRL, right, movetoworkspace, e+1
bind = CTRL $mainMod, left, movetoworkspacesilent, e-1
bind = CTRL $mainMod, right, movetoworkspacesilent, e+1

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ── Scratchpad ───────────────────────────────────────────────

bind = $mainMod, minus, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, minus, movetoworkspace, special:scratchpad

# ── Monitors ─────────────────────────────────────────────────

bind = ALT SHIFT, left, focusmonitor, l
bind = ALT SHIFT, right, focusmonitor, r
bind = $mainMod ALT, left, movewindow, mon:l
bind = $mainMod ALT, right, movewindow, mon:r

# ── Mouse ────────────────────────────────────────────────────

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── Media keys ───────────────────────────────────────────────
# Point these at the shell once it draws an OSD; wpctl until then.

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.0
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = ,XF86MonBrightnessUp, exec, brightnessctl --class=backlight set +5%
bindel = ,XF86MonBrightnessDown, exec, brightnessctl --class=backlight set 5%-

bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPrev, exec, playerctl previous

# ── Screenshots ──────────────────────────────────────────────

bind = , Print, exec, hyprshot -m region --clipboard-only
bind = SHIFT, Print, exec, hyprshot -m output -o ~/Pictures/Screenshots
bind = CTRL, Print, exec, hyprshot -m window --clipboard-only

# ── Session ──────────────────────────────────────────────────

bind = $mainMod SHIFT, E, exit
