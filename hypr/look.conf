# ─────────────────────────────────────────────────────────────
# Look and feel
# https://wiki.hypr.land/Configuring/Variables/
# Monochrome: white-ish active border, near-black inactive.
# ─────────────────────────────────────────────────────────────

$active   = rgba(e8e8ecff)
$inactive = rgba(26262cff)
$urgent   = rgba(ffffffff)

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1

    col.active_border = $active
    col.inactive_border = $inactive

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.94

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000066)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        contrast = 0.9
        brightness = 0.85
        vibrancy = 0.0
        popups = true
        popups_ignorealpha = 0.2
        new_optimizations = true
    }
}

# ─────────────────────────────────────────────────────────────
# Animations
# ─────────────────────────────────────────────────────────────

animations {
    enabled = true

    bezier = spring, 0.46, 1.0, 0.29, 1.0
    bezier = closeOut, 0.08, 0.92, 0, 1.0
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 4, spring, slide
    animation = windowsOut, 1, 8, closeOut, slide
    animation = windowsMove, 1, 5, spring
    animation = fade, 1, 3, linear
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = layers, 1, 4, spring, fade
    animation = layersIn, 1, 4, spring, fade
    animation = layersOut, 1, 3, closeOut, fade
    animation = workspaces, 1, 4, spring, slide
    animation = border, 1, 5, linear
}

# ─────────────────────────────────────────────────────────────
# Layouts
# ─────────────────────────────────────────────────────────────

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
    mfact = 0.55
    new_on_top = true
}

# ─────────────────────────────────────────────────────────────
# Misc
# ─────────────────────────────────────────────────────────────

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    focus_on_activate = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vfr = true
}

# Ask clients to drop their own title bars. Also lets Hyprland draw
# borders around windows rather than behind them.
# https://wiki.hypr.land/Configuring/Variables/#decoration
# Uncomment once you've confirmed your apps behave without CSD.
# general:no_border_on_floating = false
