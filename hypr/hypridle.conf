# Generated from settings.json by Services/Idle.qml.
# Edit the Session page in settings, not this file.

general {
    lock_cmd = qs -c island ipc call lock activate
    before_sleep_cmd = qs -c island ipc call lock activate
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ state = "on" })'
    ignore_dbus_inhibit = false
}

listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = qs -c island ipc call lock activate
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ state = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ state = "on" })'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
