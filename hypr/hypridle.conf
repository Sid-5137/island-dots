# Idle behaviour. hypridle has its own config format and does not read
# the shell's settings, so the timings here are duplicated rather than
# derived — keep them in step by hand.
#
# lock_cmd runs the shell's own lock rather than hyprlock: the session
# lock lives in quickshell so the wallpaper, clock and palette match
# the rest of the desktop.

general {
    lock_cmd = qs -c island ipc call lock activate
    before_sleep_cmd = qs -c island ipc call lock activate
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Dim the backlight first. Cheap to undo and a clear warning that the
# lock is coming.
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = qs -c island ipc call lock activate
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
