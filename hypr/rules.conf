# ─────────────────────────────────────────────────────────────
# Window rules
# https://wiki.hypr.land/Configuring/Window-Rules/
# Find a window's class and title with: hyprctl clients
# ─────────────────────────────────────────────────────────────

windowrule = suppressevent maximize, class:.*
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# ── Floating ─────────────────────────────────────────────────

windowrule = float, class:^(org.gnome.Calculator)$
windowrule = size 400 580, class:^(org.gnome.Calculator)$
windowrule = center, class:^(org.gnome.Calculator)$

windowrule = float, class:^(firefox)$, title:^(Picture-in-Picture)$
windowrule = pin, class:^(firefox)$, title:^(Picture-in-Picture)$

windowrule = float, class:^(pavucontrol)$
windowrule = size 720 560, class:^(pavucontrol)$
windowrule = center, class:^(pavucontrol)$

windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, title:^(Open File)$
windowrule = float, title:^(Save File)$
windowrule = float, title:^(Authentication Required)$

# ── Opacity ──────────────────────────────────────────────────

windowrule = opacity 1.0 override 1.0 override, class:^(firefox)$
windowrule = opacity 1.0 override 1.0 override, class:^(org.gnome.Loupe)$
windowrule = opacity 1.0 override 1.0 override, class:^(mpv)$

windowrule = opacity 0.92 override 0.92 override, class:^(kitty)$
windowrule = opacity 0.94 override 0.94 override, class:^(org.gnome.Nautilus)$

# ─────────────────────────────────────────────────────────────
# Layer rules
#
# Namespaces come from the `namespace` property you set on each
# PanelWindow in QML. The names below assume:
#
#   PanelWindow { namespace: "island-wallpaper" }   background
#   PanelWindow { namespace: "island-bar" }         the island
#   PanelWindow { namespace: "island-launcher" }
#   PanelWindow { namespace: "island-notifications" }
#   PanelWindow { namespace: "island-settings" }
#   PanelWindow { namespace: "island-osd" }
#
# Verify what actually registers with:  hyprctl layers
# ─────────────────────────────────────────────────────────────

# Wallpaper: no blur (it IS the background), no animation.
layerrule = noanim, island-wallpaper

# The island animates its own geometry in QML. Hyprland's layer
# animations fight that, so they're disabled here.
layerrule = noanim, island-bar
layerrule = blur, island-bar
layerrule = ignorealpha 0.3, island-bar

layerrule = blur, island-launcher
layerrule = ignorealpha 0.3, island-launcher
layerrule = dimaround, island-launcher

layerrule = blur, island-notifications
layerrule = ignorealpha 0.3, island-notifications

layerrule = blur, island-settings
layerrule = ignorealpha 0.3, island-settings
layerrule = dimaround, island-settings

layerrule = blur, island-osd
layerrule = ignorealpha 0.3, island-osd
layerrule = noanim, island-osd
