# ─────────────────────────────────────────────────────────────
# Autostart
# exec-once runs at session start; exec runs on every config reload.
# Sourced last so everything it spawns sees env.conf's variables.
#
# The shell owns wallpaper, notifications, OSD and the launcher, so
# there is deliberately no swaybg / mako / fuzzel line here.
# ─────────────────────────────────────────────────────────────

# Export the session environment to systemd and D-Bus. Without this,
# systemd user units and D-Bus-activated services (the portal above all)
# never see XDG_CURRENT_DESKTOP and pick the wrong backend.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE

# Polkit agent. Without one, anything needing authorization fails
# silently instead of prompting.
exec-once = /usr/libexec/polkit-mate-authentication-agent-1

# Clipboard history daemon. The shell reads from cliphist; it does not
# replace it, because something has to be watching the clipboard even
# when the shell is being reloaded.
exec-once = wl-paste --watch cliphist store

# ── The shell ────────────────────────────────────────────────
# -c names the config under ~/.config/quickshell/<name>/shell.qml
exec-once = quickshell -c island

# Fallback wallpaper for the gap between compositor start and the
# shell's background layer drawing. Uncomment if the black flash at
# login bothers you; hyprpaper exits cheaply and costs nothing after.
# exec-once = hyprpaper

# ── Later ────────────────────────────────────────────────────
# exec-once = hypridle
