# ─────────────────────────────────────────────────────────────
# Monitors
# https://wiki.hypr.land/Configuring/Basics/Monitors/
# Run `hyprctl monitors` to list outputs, modes and current state.
# ─────────────────────────────────────────────────────────────

monitor = eDP-1,1920x1080@120,0x0,1

# Catch-all for anything hotplugged (dock, projector, external panel).
# Remove this line if you'd rather unknown outputs stay dark.
monitor = ,preferred,auto,auto

# ─────────────────────────────────────────────────────────────
# Workspace rules
# https://wiki.hypr.land/Configuring/Workspace-Rules/
# ─────────────────────────────────────────────────────────────

# Persistent workspaces keep empty slots visible in a bar that only
# renders workspaces which exist. Useful once the island shows them.
# workspace = 1, monitor:eDP-1, persistent:true
# workspace = 2, monitor:eDP-1, persistent:true
# workspace = 3, monitor:eDP-1, persistent:true
# workspace = 4, monitor:eDP-1, persistent:true
# workspace = 5, monitor:eDP-1, persistent:true

# Smart gaps — drop gaps and borders when a workspace holds one
# tiled window, or one fullscreen window.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
