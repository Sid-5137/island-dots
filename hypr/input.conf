# ─────────────────────────────────────────────────────────────
# Input
# https://wiki.hypr.land/Configuring/Variables/#input
# ─────────────────────────────────────────────────────────────

input {
    kb_layout = us
    kb_rules = evdev

    follow_mouse = 1
    sensitivity = 0.8
    numlock_by_default = true

    repeat_rate = 25
    repeat_delay = 600

    force_no_accel = false
    # accel_profile = flat

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
        scroll_factor = 0.6
    }
}

cursor {
    no_warps = false
    hide_on_key_press = true
    inactive_timeout = 5
}

# ─────────────────────────────────────────────────────────────
# Gestures
# https://wiki.hypr.land/Configuring/Gestures/
# ─────────────────────────────────────────────────────────────

gesture = 3, horizontal, workspace
gesture = 4, up, dispatcher, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.0
gesture = 4, down, dispatcher, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
