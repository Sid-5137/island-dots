#
# The Qt half of what gtk-3.0/matugen.css is for GTK: the wallpaper's
# palette, in the one format Qt widgets actually read. qt6ct loads it
# as a QPalette once qt6ct.conf names it, which bin/island-qt-apply
# arranges — the same split as gtk.css and matugen.css, and for the
# same reason. qt6ct.conf holds font, icon and style settings that are
# not ours to rewrite, so matugen never writes to it.
#
# Twenty-one colours in QPalette::ColorRole order, which is positional
# and undocumented. The order was read off the schemes qt6ct ships in
# /usr/share/qt6ct/colors:
#
#    0  WindowText
#    1  Button
#    2  Light
#    3  Midlight
#    4  Dark
#    5  Mid
#    6  Text
#    7  BrightText
#    8  ButtonText
#    9  Base
#   10  Window
#   11  Shadow
#   12  Highlight
#   13  HighlightedText
#   14  Link
#   15  LinkVisited
#   16  AlternateBase
#   17  NoRole
#   18  ToolTipBase
#   19  ToolTipText
#   20  PlaceholderText
#
# The leading pair of hex digits is alpha. 61 is 38%, Material's
# disabled opacity; 80 is the half-strength placeholder text Qt's own
# schemes use.

